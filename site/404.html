<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0e110f">
    <meta name="robots" content="noindex">
    <title>Page not found — SimpleeCode</title>
    <link rel="icon" href="/assets/simpleecode-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">

  <body data-analytics-page="not_found">
    <main class="error-page">
      <div class="hero-grid" aria-hidden="true"></div>

        <h1>That page<br><em>is not here</em></h1>

        <div class="actions">
          <a class="button primary" href="/">Go to SimpleeCode</a>
          <a class="button quiet" href="/__SIMPLEECODE_VSIX__" download="__SIMPLEECODE_VSIX__" data-analytics-cta="download_vsix" data-analytics-placement="not_found">Download the latest VSIX</a>

        <p class="error-note"><a href="/#analytics-settings">Analytics settings</a></p>
      </div>
    </main>
